name: Deploy web frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: ⭐ 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: ⭐ Docker 빌드 준비
        uses: docker/setup-buildx-action@v3

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          echo "⭐ 배포 설정 확인 중"
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret/variable: $name" >&2
              exit 1
            fi
          done
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute server path." >&2; exit 1 ;;
          esac

      - name: Validate frontend API URL
        run: |
          echo "⭐ 프론트엔드 API 주소 확인 중"
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Set the GitHub repository variable VITE_API_BASE_URL to the public backend URL." >&2
            exit 1
          fi

      - name: Build and save Docker image
        run: |
          echo "⭐ 프론트엔드 Docker 이미지 빌드 중"
          docker buildx build \
            --platform "$DEPLOY_PLATFORM" \
            --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
            --tag "web-template-front:$IMAGE_TAG" \
            --load .
          echo "⭐ Docker 이미지 압축 중"
          docker save "web-template-front:$IMAGE_TAG" | gzip > web-template-front.tar.gz

      - name: Prepare deployment files
        run: |
          echo "⭐ 배포 파일 준비 중"
          mkdir upload
          cp web-template-front.tar.gz upload/

      - name: ⭐ 배포 서버로 이미지 전송
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: upload/*
          target: ${{ vars.DEPLOY_PATH }}/web-template-front
          strip_components: 1

      - name: Deploy container on server
        uses: appleboy/ssh-action@v1.0.0
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd "${{ vars.DEPLOY_PATH }}/web-template-front"
            echo "⭐ Docker 이미지 불러오는 중"
            docker load -i web-template-front.tar.gz
            echo "⭐ 서버와 이미지 아키텍처 확인 중"
            case "$(uname -m)" in
              x86_64) HOST_ARCH=amd64 ;;
              aarch64|arm64) HOST_ARCH=arm64 ;;
              *) echo "Unsupported server architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            IMAGE_ARCH=$(docker image inspect --format '{{.Architecture}}' "web-template-front:$IMAGE_TAG")
            if [ "$IMAGE_ARCH" != "$HOST_ARCH" ]; then
              echo "Image architecture linux/$IMAGE_ARCH does not match server linux/$HOST_ARCH. Set DEPLOY_PLATFORM correctly." >&2
              exit 1
            fi
            echo "⭐ 기존 프론트엔드 컨테이너 정리 중"
            docker stop web-template-front 2>/dev/null || true
            docker rm web-template-front 2>/dev/null || true
            echo "⭐ 새 프론트엔드 컨테이너 시작 중"
            docker run -d --name web-template-front \
              --restart unless-stopped \
              -p 8080:80 \
              "web-template-front:$IMAGE_TAG"
            echo "⭐ 컨테이너 실행 상태 확인 중"
            sleep 3
            if [ "$(docker inspect --format '{{.State.Status}}' web-template-front)" != "running" ]; then
              docker logs web-template-front
              exit 1
            fi
            echo "⭐ 배포 임시 파일 정리 중"
            rm -f web-template-front.tar.gz
            echo "⭐ 프론트엔드 컨테이너 배포 완료"
